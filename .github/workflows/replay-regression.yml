name: Replay Regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-lang-cyrillic \
            biber

      - name: Replay regression (skips if cache missing)
        run: |
          if [ ! -d "tests/translation_cache" ] || [ -z "$(ls -A tests/translation_cache 2>/dev/null)" ]; then
            echo "tests/translation_cache is empty; skipping replay regression."
            exit 0
          fi
          python3 tests/regression_runner.py --cache-mode replay --cache-dir tests/translation_cache --tier smoke

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            output/regression_reports/report.json
            output/regression_reports/report.md
          if-no-files-found: warn
